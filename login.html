<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — SRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .login-wrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
      }
      .login-card {
        width: min(640px, 96vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 32px;
      }
      .login-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        margin-bottom: 20px;
      }
      .login-brand .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        box-shadow: var(--shadow);
      }
      .login-brand h1 {
        margin: 0;
        font-size: 22px;
      }
      .login-brand p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .stack { display: grid; gap: 12px; }
      .password-input { position: relative; }
      .password-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted); }
      .password-toggle:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <form id="loginForm" class="login-card" novalidate>
        <div class="login-brand">
          <div class="logo">SR</div>
          <div>
            <h1>SRMS Login</h1>
            <p>Sign in to continue</p>
          </div>
        </div>
        <div class="field">
          <label for="username">Username (Full Name)</label>
          <input id="username" type="text" placeholder="Enter your full name exactly" required />
          <div class="error" data-error-for="username"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-input">
            <input id="password" type="password" placeholder="Password" required />
            <button type="button" id="togglePassword" class="password-toggle" title="Toggle password visibility">👁</button>
          </div>
          <div class="error" data-error-for="password"></div>
        </div>
        <div class="stack">
          <button type="submit" class="btn">Login</button>
        </div>
      </form>
    </div>
    <script>
      // Password toggle functionality - persistent show/hide
      document.getElementById('togglePassword').addEventListener('click', function(e) {
        e.preventDefault();
        const passwordInput = document.getElementById('password');
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        this.textContent = isHidden ? '🙈' : '👁';
      });
      const $ = (s, r=document) => r.querySelector(s);
      const USERS_KEY = 'SRMS_USERS_V2';
      const SESSION_KEY = 'SRMS_SESSION_V2';
      const THEME_KEY = 'SRMS_THEME';

             // Default users with roles
       const DEFAULT_USERS = {
         admin: { username: 'admin', password: 'admin123', role: 'admin', name: 'Administrator' },
         teacher: { username: 'teacher', password: 'teacher123', role: 'teacher', name: 'John Teacher', assignedBranches: ['BCA', 'MCA'] },
         vaibhav: { username: 'vaibhav', password: 'vaibhav123', role: 'student', name: 'Vaibhav Sanjay Patil', rollNo: 'BCA23-001' }
       };

      // Apply saved theme to support light/dark on login page
      try {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      } catch {}

      // Initialize users if they don't exist
      try {
        const existing = localStorage.getItem(USERS_KEY);
        if (!existing) {
          localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS));
          console.log('Initialized default users');
        }
      } catch (error) {
        console.error('Error initializing users:', error);
        localStorage.setItem(USERS_KEY, JSON.stringify(DEFAULT_USERS));
      }

      // Already logged in
      try {
        const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (session && session.exp > Date.now()) {
          location.href = 'index.html';
        }
      } catch {}

      $('#loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        $('.error[data-error-for="username"]').textContent = '';
        $('.error[data-error-for="password"]').textContent = '';

        const username = $('#username').value;  // Don't trim - username might have spaces
        const password = $('#password').value;
        let valid = true;
        if (!username) { $('.error[data-error-for="username"]').textContent = 'Required'; valid = false; }
        if (!password) { $('.error[data-error-for="password"]').textContent = 'Required'; valid = false; }
        if (!valid) return;

        try {
          const users = JSON.parse(localStorage.getItem(USERS_KEY) || 'null') || DEFAULT_USERS;
          console.log('Attempting login with username:', username);
          console.log('Available users:', Object.keys(users));
          
          const user = users[username];
          if (!user) {
            console.log('User not found');
            $('.error[data-error-for="username"]').textContent = 'Username not found. Use your exact full name.';
            return;
          }
          
          if (user.password !== password) {
            console.log('Invalid password');
            $('.error[data-error-for="password"]').textContent = 'Invalid password';
            return;
          }

          // Login successful
          const session = { 
            username, 
            role: user.role, 
            name: user.name,
            exp: Date.now() + 24*3600*1000 
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          location.href = 'index.html';
        } catch (error) {
          console.error('Login error:', error);
          $('.error[data-error-for="password"]').textContent = 'Unexpected error';
        }
      });
    </script>
  </body>
  </html>
